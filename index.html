<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화요일 시험 · 강의실 예약</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1c1e; --sub:#6b6b70; --line:#dcdde1;
          --ok:#1f9d55; --okbg:#e6f6ec; --ng:#d62d20; --ngbg:#fdeaea; --accent:#2f6fde; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111214; --card:#1c1d20; --text:#f2f2f4; --sub:#a0a0a6; --line:#34353a;
            --okbg:#123322; --ngbg:#3a1614; --accent:#5b8ff0; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 4px; }
  .sub { color:var(--sub); font-size:14px; margin:0 0 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  h2 { font-size:17px; margin:0 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); gap:10px; }
  label { display:flex; flex-direction:column; font-size:13px; color:var(--sub); gap:4px; }
  input, select, button { font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line);
                          background:var(--bg); color:var(--text); min-height:44px; width:100%; }
  button { background:var(--accent); color:#fff; border:none; font-weight:600; margin-top:12px; cursor:pointer; grid-column:1/-1; }
  button:disabled { opacity:.5; cursor:wait; }
  .wide { grid-column:1/-1; }
  .result { margin-top:12px; padding:14px; border-radius:10px; font-size:26px; font-weight:800; text-align:center; }
  .result:empty { display:none; }
  .result.ok { background:var(--okbg); color:var(--ok); }
  .result.ng { background:var(--ngbg); color:var(--ng); }
  .result small { display:block; font-size:14px; font-weight:400; color:var(--sub); }
  table { width:100%; border-collapse:collapse; margin-top:8px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); }
  .empty { color:var(--sub); margin:12px 0 0; }
  #status { padding:10px 14px; border-radius:10px; background:var(--card); border:1px solid var(--line); margin-bottom:16px; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>화요일 시험 · 강의실 예약</h1>
  <p class="sub">예약 규칙은 모두 <code>solution.py</code>의 <code>RoomBooking</code>이 판단합니다. 이 화면은 입력을 전달하고 결과만 보여 줍니다.
    강의실 A101·A102·B201, 요일 월~금, 9~21시, 한 번에 최대 3시간, 한 사람당 하루 2건까지 예약할 수 있습니다.</p>
  <div id="status" role="status">solution.py 불러오는 중… (처음엔 몇 초 걸립니다)</div>

  <!-- 강의실·요일은 목록에서 고르거나 직접 입력 가능(C999, 일 같은 잘못된 값도 그대로 solution.py로 전달) -->
  <datalist id="rooms"><option value="A101"><option value="A102"><option value="B201"></datalist>
  <datalist id="days"><option value="월"><option value="화"><option value="수"><option value="목"><option value="금"></datalist>

  <section>
    <h2>예약</h2>
    <form id="f-book" class="grid">
      <label>강의실<input name="room" list="rooms" value="A101" required></label>
      <label>요일<input name="day" list="days" value="월" required></label>
      <label>시작(시)<input name="start" inputmode="decimal" value="10" required></label>
      <label>끝(시)<input name="end" inputmode="decimal" value="12" required></label>
      <label class="wide">이름<input name="name" placeholder="예: 김민수" required></label>
      <button disabled>예약하기</button>
    </form>
    <div id="r-book" class="result" aria-live="polite"></div>
  </section>

  <section>
    <h2>취소</h2>
    <form id="f-cancel" class="grid">
      <label>강의실<input name="room" list="rooms" value="A101" required></label>
      <label>요일<input name="day" list="days" value="월" required></label>
      <label>시작 시각(시)<input name="start" inputmode="decimal" value="10" required></label>
      <label>이름<input name="name" placeholder="예약한 사람" required></label>
      <button disabled>취소하기</button>
    </form>
    <div id="r-cancel" class="result" aria-live="polite"></div>
  </section>

  <section>
    <h2>시간표</h2>
    <form id="f-sched" class="grid">
      <label>강의실<select name="room"><option>A101</option><option>A102</option><option>B201</option></select></label>
      <label>요일<select name="day"><option>월</option><option>화</option><option>수</option><option>목</option><option>금</option></select></label>
      <button disabled>시간표 보기</button>
    </form>
    <div id="sched"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
(function () {
  var rb = null, pyBook = null, pyCancel = null;
  var fSched = document.getElementById("f-sched");

  // 시각 입력을 파이썬 안에서 숫자로 바꾼 뒤 그대로 RoomBooking 에 넘김(규칙 판단은 전부 solution.py 몫).
  // JS 는 10.0 과 10 을 구분하지 못해 JS 에서 바꾸면 "10.0" 이 정수로 넘어가므로 변환을 파이썬에서 함
  var GLUE = [
    "import importlib, sys",
    "sys.path.insert(0, '.'); importlib.invalidate_caches()",
    "from solution import RoomBooking",
    "rb = RoomBooking()",
    "def num(s):",
    "    s = s.strip()",
    "    for f in (int, float):",
    "        try:",
    "            return f(s)",
    "        except ValueError:",
    "            pass",
    "    return s",
    "def web_book(room, day, s, e, name):",
    "    return rb.book(room, day, num(s), num(e), name)",
    "def web_cancel(room, day, s, name):",
    "    return rb.cancel(room, day, num(s), name)"
  ].join("\n");

  function show(el, ok, detail) {
    el.className = "result " + (ok ? "ok" : "ng");
    el.textContent = ok ? "성공" : "실패";
    var small = document.createElement("small");
    small.textContent = detail;
    el.appendChild(small);
  }

  function hasOption(select, v) {
    return Array.prototype.some.call(select.options, function (o) { return o.value === v; });
  }

  function renderSchedule(room, day) {
    fSched.room.value = room; fSched.day.value = day;
    var proxy = rb.get_schedule(room, day);
    var rows = proxy.toJs(); proxy.destroy();
    var box = document.getElementById("sched");
    box.textContent = "";
    var cap = document.createElement("p"); cap.className = "empty";
    cap.textContent = room + " · " + day + "요일 " + (rows.length ? "(시작 시각 순)" : ": 예약 없음");
    box.appendChild(cap);
    if (!rows.length) return;
    var t = document.createElement("table");
    var head = t.createTHead().insertRow();
    ["시간", "예약자"].forEach(function (h) { var th = document.createElement("th"); th.textContent = h; head.appendChild(th); });
    var tb = t.createTBody();
    rows.forEach(function (r) {
      var tr = tb.insertRow();
      tr.insertCell().textContent = r[0] + "시 ~ " + r[1] + "시";
      tr.insertCell().textContent = r[2];
    });
    box.appendChild(t);
  }

  // 예약·취소 뒤 그 강의실·요일 시간표를 바로 보여 줌(시간표 목록에 있는 값일 때만)
  function refresh(room, day) {
    if (hasOption(fSched.room, room) && hasOption(fSched.day, day)) renderSchedule(room, day);
  }

  document.getElementById("f-book").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, room = f.room.value.trim(), day = f.day.value.trim(), name = f.name.value.trim();
    var s = f.start.value.trim(), en = f.end.value.trim();
    var ok = pyBook(room, day, s, en, name);
    show(document.getElementById("r-book"), ok, name + " · " + room + " · " + day + " · " + s + "~" + en + "시");
    refresh(room, day);
  });

  document.getElementById("f-cancel").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, room = f.room.value.trim(), day = f.day.value.trim(), name = f.name.value.trim();
    var s = f.start.value.trim();
    var ok = pyCancel(room, day, s, name);
    show(document.getElementById("r-cancel"), ok, name + " · " + room + " · " + day + " · " + s + "시 시작 예약 취소");
    refresh(room, day);
  });

  fSched.addEventListener("submit", function (e) {
    e.preventDefault();
    renderSchedule(fSched.room.value, fSched.day.value);
  });

  async function boot() {
    var status = document.getElementById("status");
    try {
      var py = await loadPyodide();
      // 재배포 직후에도 최신 solution.py 를 받도록 캐시를 피함
      var res = await fetch("solution.py?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("solution.py 를 받지 못했습니다 (HTTP " + res.status + ")");
      py.FS.writeFile("solution.py", await res.text(), { encoding: "utf8" });
      py.runPython(GLUE);
      rb = py.globals.get("rb");
      pyBook = py.globals.get("web_book");
      pyCancel = py.globals.get("web_cancel");
      window.rb = rb; window.py = py; // 콘솔 확인용
      document.querySelectorAll("button").forEach(function (b) { b.disabled = false; });
      status.textContent = "준비 완료 · solution.py 의 RoomBooking 으로 동작 중 (새로고침하면 예약이 비워집니다)";
      renderSchedule("A101", "월");
    } catch (err) {
      status.textContent = "불러오기 실패: " + err.message;
      status.style.color = "var(--ng)";
    }
  }
  boot();
})();
</script>
</body>
</html>
